<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft Dofus</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="view-scan">
<header class="top">
  <h1>Craft Dofus</h1>
  <div id="view-switch" class="seg">
    <button data-view="scan">Scan</button>
    <button data-view="donnees">Données</button>
    <button data-view="resultats">Craft</button>
  </div>
  <div class="spacer"></div>
  <div class="actions">
  <button id="pip" class="secondary small hidden" title="Ouvrir dans une fenêtre qui reste au-dessus du jeu (Chrome, Edge)">Flottant</button>
  <button id="settings-btn" class="secondary small gear" title="Réglages : seuils, métiers, sauvegarde de la base">⚙</button>
  </div>
</header>

<main>
  <!-- ===== Scan ===== -->
  <section class="card view-scan">
    <div class="row"><h2>Plan de scan</h2></div>
    <div class="row">
      <button id="cap-start" class="cta-cap" title="Choisis la fenêtre du jeu dans la boîte de partage du navigateur">Capturer le jeu</button>
      <button id="scan" class="primary" disabled title="Lit l'écran choisi dans « Je scanne » et l'enregistre">Scanner</button>
      <div class="spacer"></div>
      <button id="zones-btn" class="secondary small" disabled title="Indiquer où se trouve la zone du mode choisi">Zones</button>
    </div>
    <div class="row small"><label class="sel muted">Je scanne <select id="mode" class="small"></select></label>
      <div class="spacer"></div><button id="saisir" class="secondary small" title="Saisir à la main le nom et la valeur">Saisir</button></div>
    <div id="scan-status" class="muted small"></div>
    <div id="saisie"></div>
    <div id="lecture"></div>
    <div id="plan"></div>
  </section>

  <!-- ===== Données ===== -->
  <section class="card view-donnees hidden">
    <div id="donnees"></div>
  </section>

  <!-- ===== Craft ===== -->
  <section class="card view-resultats hidden">
    <div class="row">
      <h2>Budget</h2>
      <div class="spacer"></div>
      <label class="small muted sel">Investir <input id="budget" type="text" inputmode="numeric" class="num"> M</label>
    </div>
    <div id="allocation"></div>
  </section>
  <section class="card view-resultats hidden">
    <div class="row"><h2>Items évalués</h2><span id="eval-sub" class="muted small"></span></div>
    <div id="evalues"></div>
  </section>

  <!-- ===== Réglages (⚙) ===== -->
  <section class="card view-base hidden">
    <div class="row"><h2>Base de prix</h2><div class="spacer"></div><button id="settings-back" class="primary small">Retour</button></div>
    <div id="base-stats"></div>
    <div class="row">
      <button id="base-export" class="secondary small">Exporter</button>
      <button id="base-import" class="secondary small">Importer</button>
      <input id="base-file" type="file" accept="application/json" class="hidden">
      <div class="spacer"></div>
      <button id="base-reset" class="link small">vider la base</button>
    </div>
  </section>
  <section class="card view-base hidden">
    <div class="row"><h2>Réglages</h2></div>
    <div id="reglages" class="reglages"></div>
  </section>
</main>

<div id="zones-modal" class="modal hidden">
  <div class="modal-box">
    <div class="row"><h2 id="zones-title"></h2><div class="spacer"></div>
      <button id="zones-default" class="secondary small">Par défaut</button>
      <button id="zones-cancel" class="secondary small">Annuler</button></div>
    <p class="muted small" id="zones-help"></p>
    <div class="zones-wrap"><canvas id="zones-canvas"></canvas></div>
  </div>
</div>

<footer class="muted small">
  Recettes et ressources DofusDB. Lecture de captures d'écran uniquement : aucune lecture du réseau, aucun clic automatisé.
</footer>

<script type="module" src="src/ui.js"></script>
</body>
</html>
